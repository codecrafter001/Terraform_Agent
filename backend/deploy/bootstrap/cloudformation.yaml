AWSTemplateFormatVersion: "2010-09-09"
Description: "TerraAgent customer bootstrap: creates least-privilege Plan and Apply IAM roles, Workload Boundary, and S3 state bucket."

Parameters:
  TerraAgentPrincipalArn:
    Type: String
    Description: "The ARN of TerraAgent's AWS role or user (e.g. arn:aws:iam::123456789012:role/TerraAgentPlatform)"
    AllowedPattern: "^arn:aws[a-z0-9-]*:iam::\\d{12}:(role|user)/.+$"
  ExternalId:
    Type: String
    Description: "Tenant-specific ExternalId generated by TerraAgent Settings -> Deploy Targets"
    MinLength: 16
    MaxLength: 128
  StateBucketName:
    Type: String
    Description: "Globally unique name for the Terraform remote state S3 bucket"
    AllowedPattern: "^[a-z0-9.-]{3,63}$"

Resources:
  TerraformStateBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Ref StateBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraAgentWorkloadBoundary:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: TerraAgentWorkloadBoundary
      Description: "Permissions boundary capping any IAM role created by TerraAgent for application workloads"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBasicLogsAndMetrics
            Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
              - "cloudwatch:PutMetricData"
            Resource: "*"
          - Sid: AllowScopedResourceAccess
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:ListBucket"
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:Query"
              - "dynamodb:Scan"
            Resource:
              - "arn:aws:s3:::terraagent-*"
              - "arn:aws:dynamodb:*:*:table/terraagent-*"
          - Sid: DenyPrivilegeEscalation
            Effect: Deny
            Action:
              - "iam:*"
              - "organizations:*"
              - "account:*"
            Resource: "*"

  TerraAgentDeployPlanRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: TerraAgentDeployPlan
      Description: "Read-only plan role for TerraAgent code deployments"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TerraAgentPrincipalArn
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: TerraAgentPlanPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadServices
                Effect: Allow
                Action:
                  - "s3:Get*"
                  - "s3:List*"
                  - "lambda:Get*"
                  - "lambda:List*"
                  - "apigateway:GET"
                  - "cloudfront:Get*"
                  - "cloudfront:List*"
                  - "logs:Describe*"
                  - "logs:Get*"
                  - "iam:Get*"
                  - "iam:List*"
                  - "ecs:Describe*"
                  - "ecs:List*"
                  - "ecr:Describe*"
                  - "ecr:Get*"
                  - "ecr:List*"
                  - "codebuild:BatchGet*"
                  - "codebuild:List*"
                  - "elasticloadbalancing:Describe*"
                  - "ec2:Describe*"
                Resource: "*"
              - Sid: AllowStateReadAndLock
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource:
                  - !Sub "arn:aws:s3:::${StateBucketName}"
                  - !Sub "arn:aws:s3:::${StateBucketName}/*"

  TerraAgentDeployApplyRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: TerraAgentDeployApply
      Description: "Deployment execution role for TerraAgent with strict boundary and name scoping"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TerraAgentPrincipalArn
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
              - "sts:SetSourceIdentity"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: TerraAgentApplyScopedPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowScopedInfrastructure
                Effect: Allow
                Action:
                  - "s3:*"
                  - "lambda:*"
                  - "apigateway:*"
                  - "cloudfront:*"
                  - "logs:*"
                  - "ecs:*"
                  - "ecr:*"
                  - "codebuild:*"
                  - "elasticloadbalancing:*"
                  - "ec2:Describe*"
                  - "ec2:CreateSecurityGroup"
                  - "ec2:AuthorizeSecurityGroupIngress"
                  - "ec2:AuthorizeSecurityGroupEgress"
                  - "ec2:RevokeSecurityGroupIngress"
                  - "ec2:RevokeSecurityGroupEgress"
                  - "ec2:DeleteSecurityGroup"
                  - "ec2:CreateTags"
                Resource: "*"
                Condition:
                  StringLike:
                    "aws:ResourceTag/terraagent:managed": "true"
              - Sid: AllowCreateTaggedResources
                Effect: Allow
                Action:
                  - "s3:CreateBucket"
                  - "s3:PutBucket*"
                  - "lambda:CreateFunction"
                  - "lambda:TagResource"
                  - "apigateway:POST"
                  - "cloudfront:CreateDistribution"
                  - "logs:CreateLogGroup"
                  - "ecr:CreateRepository"
                  - "ecs:CreateCluster"
                  - "elasticloadbalancing:CreateLoadBalancer"
                  - "elasticloadbalancing:CreateTargetGroup"
                Resource: "*"
              - Sid: AllowIAMRolesWithBoundary
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:PutRolePolicy"
                  - "iam:AttachRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:DetachRolePolicy"
                  - "iam:DeleteRole"
                  - "iam:TagRole"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:ListRolePolicies"
                  - "iam:ListAttachedRolePolicies"
                Resource: "arn:aws:iam::*:role/terraagent/*"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary": !Sub "arn:aws:iam::${AWS::AccountId}:policy/TerraAgentWorkloadBoundary"
              - Sid: AllowPassRoleToWorkloads
                Effect: Allow
                Action: "iam:PassRole"
                Resource: "arn:aws:iam::*:role/terraagent/*"
                Condition:
                  StringEquals:
                    "iam:PassedToService":
                      - "lambda.amazonaws.com"
                      - "ecs-tasks.amazonaws.com"
                      - "codebuild.amazonaws.com"
              - Sid: AllowStateManagement
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - !Sub "arn:aws:s3:::${StateBucketName}"
                  - !Sub "arn:aws:s3:::${StateBucketName}/*"
              - Sid: ExplicitSecurityDenies
                Effect: Deny
                Action:
                  - "iam:CreateUser"
                  - "iam:CreateAccessKey"
                  - "iam:CreateLoginProfile"
                  - "organizations:*"
                  - "account:*"
                  - "kms:ScheduleKeyDeletion"
                Resource: "*"

Outputs:
  PlanRoleArn:
    Description: "ARN of the TerraAgent Plan Role"
    Value: !GetAtt TerraAgentDeployPlanRole.Arn
  ApplyRoleArn:
    Description: "ARN of the TerraAgent Apply Role"
    Value: !GetAtt TerraAgentDeployApplyRole.Arn
  StateBucketName:
    Description: "S3 State Bucket Name"
    Value: !Ref TerraformStateBucket
