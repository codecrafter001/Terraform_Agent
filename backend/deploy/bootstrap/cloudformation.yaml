AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TerraAgent customer bootstrap: the Terraform state bucket, the read-only Plan role, the scoped
  Apply role and the permissions boundary every workload role TerraAgent creates must carry.
  Mirrors terraform/main.tf; keep the two in step (tests/test_deploy_bootstrap.py compares them).

Parameters:
  TerraAgentPrincipalArn:
    Type: String
    Description: "The ARN of TerraAgent's AWS role or user (e.g. arn:aws:iam::123456789012:role/TerraAgentPlatform)"
    AllowedPattern: "^arn:aws[a-z0-9-]*:iam::\\d{12}:(role|user)/.+$"
  ExternalId:
    Type: String
    Description: "Tenant-specific ExternalId generated by TerraAgent Settings -> Deploy Targets"
    MinLength: 16
    MaxLength: 128
    NoEcho: true
  StateBucketName:
    Type: String
    Description: "Globally unique name for the Terraform remote state S3 bucket"
    AllowedPattern: "^[a-z0-9.-]{3,63}$"

Resources:
  TerraformStateBucket:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref StateBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: "terraagent:managed"
          Value: "true"
        - Key: Name
          Value: terraagent-state

  # ---------------------------------------------------------------------------
  # Workload permissions boundary
  # ---------------------------------------------------------------------------
  TerraAgentWorkloadBoundary:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: TerraAgentWorkloadBoundary
      Description: "Permissions boundary capping IAM roles created by TerraAgent for application workloads"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBasicLogsAndMetrics
            Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
              - "cloudwatch:PutMetricData"
              - "ecr:GetAuthorizationToken"
              - "cloudfront:CreateInvalidation"
              - "cloudfront:ListDistributions"
            Resource: "*"
          - Sid: AllowScopedResourceAccess
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:PutObject"
              - "s3:DeleteObject"
              - "s3:ListBucket"
              - "s3:GetBucketLocation"
              - "s3:GetBucketVersioning"
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:Query"
              - "dynamodb:Scan"
            Resource:
              - "arn:aws:s3:::terraagent-*"
              - "arn:aws:dynamodb:*:*:table/terraagent-*"
          - Sid: AllowContainerPipeline
            Effect: Allow
            Action:
              - "ecr:BatchCheckLayerAvailability"
              - "ecr:BatchGetImage"
              - "ecr:CompleteLayerUpload"
              - "ecr:DescribeImages"
              - "ecr:GetDownloadUrlForLayer"
              - "ecr:InitiateLayerUpload"
              - "ecr:PutImage"
              - "ecr:UploadLayerPart"
              - "ecs:UpdateService"
              - "ecs:DescribeServices"
              - "codebuild:StartBuild"
              - "codebuild:BatchGetBuilds"
              - "codepipeline:StartPipelineExecution"
            Resource:
              - "arn:aws:ecr:*:*:repository/terraagent-*"
              - "arn:aws:ecs:*:*:service/terraagent-*/*"
              - "arn:aws:codebuild:*:*:project/terraagent-*"
              - "arn:aws:codepipeline:*:*:terraagent-*"
          - Sid: AllowReadingAppSecretsAtTaskStart
            Effect: Allow
            Action:
              - "secretsmanager:GetSecretValue"
            Resource:
              - "arn:aws:secretsmanager:*:*:secret:terraagent-*"
              - "arn:aws:secretsmanager:*:*:secret:rds!*"
          - Sid: DenyPrivilegeEscalation
            Effect: Deny
            Action:
              - "iam:*"
              - "organizations:*"
              - "account:*"
            Resource: "*"

  # ---------------------------------------------------------------------------
  # Plan role (read-only)
  # ---------------------------------------------------------------------------
  TerraAgentDeployPlanRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: TerraAgentDeployPlan
      Description: "Read-only plan role for TerraAgent code deployments"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TerraAgentPrincipalArn
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: TerraAgentPlanPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadServices
                Effect: Allow
                Action:
                  - "s3:Get*"
                  - "s3:List*"
                  - "lambda:Get*"
                  - "lambda:List*"
                  - "apigateway:GET"
                  - "cloudfront:Get*"
                  - "cloudfront:List*"
                  - "cloudfront:Describe*"
                  - "logs:Describe*"
                  - "logs:Get*"
                  - "logs:List*"
                  - "iam:Get*"
                  - "iam:List*"
                  - "ecs:Describe*"
                  - "ecs:List*"
                  - "ecr:Describe*"
                  - "ecr:Get*"
                  - "ecr:List*"
                  - "codebuild:BatchGet*"
                  - "codebuild:List*"
                  - "codepipeline:Get*"
                  - "codepipeline:List*"
                  - "events:Describe*"
                  - "events:List*"
                  - "elasticloadbalancing:Describe*"
                  - "ec2:Describe*"
                  - "rds:Describe*"
                  - "rds:ListTagsForResource"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:GetResourcePolicy"
                  - "elasticache:Describe*"
                  - "elasticache:List*"
                  - "application-autoscaling:Describe*"
                  - "servicequotas:GetServiceQuota"
                Resource: "*"
              - Sid: AllowStateReadAndLock
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource:
                  - !Sub "arn:aws:s3:::${StateBucketName}"
                  - !Sub "arn:aws:s3:::${StateBucketName}/*"

  # ---------------------------------------------------------------------------
  # Apply role (scoped mutation); a per-deployment session policy narrows it
  # further (backend/deploy/sts.py::apply_session_policy).
  # ---------------------------------------------------------------------------
  TerraAgentDeployApplyRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: TerraAgentDeployApply
      Description: "Deployment execution role for TerraAgent with strict boundary and name scoping"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TerraAgentPrincipalArn
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
              - "sts:SetSourceIdentity"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: TerraAgentApplyScopedPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowNamespacedResources
                Effect: Allow
                Action:
                  - "s3:*"
                  - "lambda:*"
                  - "logs:*"
                  - "ecs:*"
                  - "ecr:*"
                  - "codebuild:*"
                  - "codepipeline:*"
                  - "events:*"
                  - "elasticloadbalancing:*"
                  - "rds:*"
                  - "secretsmanager:*"
                  - "cloudfront:*"
                  - "elasticache:*"
                Resource: "arn:aws:*:*:*:*terraagent-*"
              - Sid: AllowTaggedCreate
                Effect: Allow
                Action:
                  - "ec2:CreateVpc"
                  - "ec2:CreateSubnet"
                  - "ec2:CreateInternetGateway"
                  - "ec2:CreateRouteTable"
                  - "ec2:CreateSecurityGroup"
                  - "cloudfront:CreateDistribution"
                  - "cloudfront:CreateDistributionWithTags"
                  - "ecs:RegisterTaskDefinition"
                  - "apigateway:POST"
                  - "application-autoscaling:RegisterScalableTarget"
                  - "application-autoscaling:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/terraagent:managed": "true"
              - Sid: AllowTaggingOnCreate
                Effect: Allow
                Action:
                  - "ec2:CreateTags"
                Resource: "*"
                Condition:
                  StringEquals:
                    "ec2:CreateAction":
                      - CreateVpc
                      - CreateSubnet
                      - CreateInternetGateway
                      - CreateRouteTable
                      - CreateSecurityGroup
              - Sid: AllowEcsTaggingOnCreate
                Effect: Allow
                Action:
                  - "ecs:TagResource"
                Resource: "*"
                Condition:
                  StringEquals:
                    "ecs:CreateAction": RegisterTaskDefinition
              - Sid: AllowTaggedManage
                Effect: Allow
                Action:
                  - "ec2:*"
                  - "cloudfront:*"
                  - "ecs:*"
                  - "apigateway:*"
                  - "application-autoscaling:*"
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/terraagent:managed": "true"
              - Sid: AllowReadAndHelpers
                Effect: Allow
                Action:
                  - "ec2:Describe*"
                  - "ecs:Describe*"
                  - "ecs:List*"
                  - "ecs:DeregisterTaskDefinition"
                  - "elasticloadbalancing:Describe*"
                  - "rds:Describe*"
                  - "cloudfront:Get*"
                  - "cloudfront:List*"
                  - "cloudfront:Describe*"
                  - "cloudfront:CreateOriginAccessControl"
                  - "cloudfront:GetOriginAccessControl"
                  - "cloudfront:UpdateOriginAccessControl"
                  - "cloudfront:DeleteOriginAccessControl"
                  - "kms:DescribeKey"
                  - "elasticache:Describe*"
                  - "application-autoscaling:Describe*"
                Resource: "*"
              - Sid: AllowSecurityGroupRules
                Effect: Allow
                Action:
                  - "ec2:*SecurityGroup*"
                Resource: "arn:aws:ec2:*:*:security-group-rule/*"
              - Sid: AllowServiceLinkedRoles
                Effect: Allow
                Action: "iam:CreateServiceLinkedRole"
                Resource: "arn:aws:iam::*:role/aws-service-role/*"
                Condition:
                  StringEquals:
                    "iam:AWSServiceName":
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com
                      - elasticache.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com
              - Sid: AllowRdsManagedSecret
                Effect: Allow
                Action:
                  - "secretsmanager:CreateSecret"
                  - "secretsmanager:TagResource"
                  - "secretsmanager:RotateSecret"
                  - "secretsmanager:DeleteSecret"
                  - "secretsmanager:DescribeSecret"
                Resource: "arn:aws:secretsmanager:*:*:secret:rds!*"
              - Sid: AllowIAMRolesWithBoundary
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:PutRolePolicy"
                  - "iam:AttachRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:DetachRolePolicy"
                Resource: "arn:aws:iam::*:role/terraagent/*"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary": !Ref TerraAgentWorkloadBoundary
              - Sid: AllowIAMRoleLifecycle
                Effect: Allow
                Action:
                  - "iam:DeleteRole"
                  - "iam:TagRole"
                  - "iam:UntagRole"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:ListRolePolicies"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:ListInstanceProfilesForRole"
                  - "iam:ListRoleTags"
                Resource: "arn:aws:iam::*:role/terraagent/*"
              - Sid: AllowPassRoleToWorkloads
                Effect: Allow
                Action: "iam:PassRole"
                Resource: "arn:aws:iam::*:role/terraagent/*"
                Condition:
                  StringEquals:
                    "iam:PassedToService":
                      - lambda.amazonaws.com
                      - ecs-tasks.amazonaws.com
                      - codebuild.amazonaws.com
                      - codepipeline.amazonaws.com
                      - events.amazonaws.com
              - Sid: AllowStateManagement
                Effect: Allow
                Action: "s3:*"
                Resource:
                  - !Sub "arn:aws:s3:::${StateBucketName}"
                  - !Sub "arn:aws:s3:::${StateBucketName}/*"
              - Sid: ExplicitSecurityDenies
                Effect: Deny
                Action:
                  - "iam:CreateUser"
                  - "iam:CreateAccessKey"
                  - "iam:CreateLoginProfile"
                  - "iam:PutRolePermissionsBoundary"
                  - "iam:DeleteRolePermissionsBoundary"
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:PutSecretValue"
                  - "organizations:*"
                  - "account:*"
                  - "kms:ScheduleKeyDeletion"
                Resource: "*"

Outputs:
  PlanRoleArn:
    Description: "ARN of the TerraAgent Plan role (paste into Settings -> Deploy Targets)"
    Value: !GetAtt TerraAgentDeployPlanRole.Arn
  ApplyRoleArn:
    Description: "ARN of the TerraAgent Apply role"
    Value: !GetAtt TerraAgentDeployApplyRole.Arn
  PermissionsBoundaryArn:
    Description: "Boundary every workload role TerraAgent creates must carry"
    Value: !Ref TerraAgentWorkloadBoundary
  StateBucketName:
    Description: "Terraform state bucket"
    Value: !Ref TerraformStateBucket
