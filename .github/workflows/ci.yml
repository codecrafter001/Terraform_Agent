name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never echo/print env or secrets in any step below - job output is public on
# forked-repo PRs. This pipeline uses no real secrets: all AWS credentials
# used in tests are fixed, publicly-known AWS documentation example values
# (e.g. AKIAIOSFODNN7EXAMPLE), never real keys.

jobs:
  lint:
    name: Lint (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend lint dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Ruff (backend)
        working-directory: backend
        run: ruff check .

      - name: Mypy (backend)
        working-directory: backend
        run: mypy . --exclude tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npm run typecheck

  test:
    name: Test (pytest + LocalStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Start Redis and LocalStack
        run: docker compose --profile test up -d terraagent-redis terraagent-localstack

      - name: Wait for LocalStack health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "LocalStack is up"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time" >&2
          exit 1

      - name: Run unit, security, and API tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest -v -m "not integration"

      - name: Run LocalStack pipeline integration test
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: "sqlite:///:memory:"
          LOCALSTACK_URL: http://localhost:4566
        # Best-effort: the full pipeline also calls the local Ollama LLM for
        # documentation generation, which CI runners don't have provisioned
        # (no GPU, no pre-pulled model). Runs when a matching CI-side Ollama
        # is available; otherwise this step is expected to skip/fail without
        # blocking the required lint/unit/API signal above.
        continue-on-error: true
        run: pytest -v -m integration

      - name: Tear down test containers
        if: always()
        run: docker compose --profile test down -v

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images
        run: docker compose build

      - name: Verify images were created
        run: |
          docker image inspect terraagent-api >/dev/null || docker images | grep -i terraagent
          docker compose config --images
