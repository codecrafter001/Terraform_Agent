name: "Terraform Plan (PR Review)"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "*.tf"

permissions:
  id-token: write      # Required for requesting the JWT via AWS STS OIDC
  contents: read       # Required to checkout the repository
  pull-requests: write # Required to comment execution plan on the Pull Request

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  TF_WORKING_DIR: "terraform"
  TERRAFORM_VERSION: "1.9.5"

jobs:
  plan:
    name: "Terraform Plan & Validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials via OIDC (STS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"
          role-session-name: "github-actions-tf-plan-${{ github.event.pull_request.number }}"

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: false

      - name: Post Plan Summary to GitHub Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planFilePath = '${{ env.TF_WORKING_DIR }}/plan_output.txt';
            let planOutput = 'No plan output generated.';
            if (fs.existsSync(planFilePath)) {
              planOutput = fs.readFileSync(planFilePath, 'utf8');
            }
            
            // GitHub PR comment limit is 65536 characters
            if (planOutput.length > 55000) {
              planOutput = planOutput.substring(0, 55000) + '\n... [Plan output truncated due to comment length limit]';
            }

            const commentBody = `### 🤖 TerraAgent CI: Terraform Plan Result
            
            | Step | Status |
            | :--- | :--- |
            | 🖌 **Format (`fmt`)** | \`${{ steps.fmt.outcome }}\` |
            | ⚙️ **Init (`init`)** | \`${{ steps.init.outcome }}\` |
            | 🔍 **Validation (`validate`)** | \`${{ steps.validate.outcome }}\` |
            | 📋 **Plan (`plan`)** | \`${{ steps.plan.outcome }}\` |

            <details>
            <summary>📖 View Detailed Plan Output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`
            </details>

            *Action triggered by @${{ github.actor }} on commit \`${{ github.sha }}\` via PR #${{ github.event.pull_request.number }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
