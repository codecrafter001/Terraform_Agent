name: "Terraform Apply (Merge to Main)"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "*.tf"

permissions:
  id-token: write      # Required for requesting the JWT via AWS STS OIDC
  contents: read       # Required to checkout the repository

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  TF_WORKING_DIR: "terraform"
  TERRAFORM_VERSION: "1.9.5"

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    environment: production  # Enables environment protection rules & manual approval gates if configured in GitHub repo settings

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials via OIDC (STS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"
          role-session-name: "github-actions-tf-apply-${{ github.sha }}"

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -no-color
