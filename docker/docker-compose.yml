version: "3.8"

networks:
  terraagent-net:
    driver: bridge

services:
  # ============================================================================
  # 1. FastAPI REST API & Orchestrator Gateway
  # ============================================================================
  terraagent-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: terraagent-api
    restart: unless-stopped
    # No host port publish: services/rate_limiter.py's get_client_ip() trusts
    # X-Forwarded-For, which is only safe if Nginx (port 80, below) is
    # genuinely the only way in - publishing 8000 directly let any caller
    # bypass Nginx and spoof any X-Forwarded-For value, making the per-IP
    # scan rate limit trivially bypassable (verified: a fixed client sending
    # a different X-Forwarded-For per request was treated as a new client
    # every time). terraagent-frontend/nginx reach this over terraagent-net.
    volumes:
      - ../security:/app/security:ro
      - terraagent_output:/tmp/terraagent
      - terraform_plugin_cache:/home/agent/.terraform.d/plugin-cache
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@terraagent-redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@terraagent-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@terraagent-redis:6379/0
      - OLLAMA_HOST=http://terraagent-ollama:11434
      - DATABASE_URL=postgresql://terraagent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@terraagent-postgres:5432/terraagent
    networks:
      - terraagent-net
    depends_on:
      terraagent-redis:
        condition: service_started
      terraagent-ollama:
        condition: service_started
      terraagent-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. Next.js 14 Frontend Dashboard & Graph Viewer
  # ============================================================================
  terraagent-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: terraagent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Through Nginx (port 80), not the backend container directly - :8000 is
      # no longer published to the host (see terraagent-api's comment above),
      # and routing browser calls through Nginx is what makes
      # rate_limiter.py's X-Forwarded-For trust valid in the first place.
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - BACKEND_API_INTERNAL_URL=http://terraagent-api:8000/api/:path*
      # Read by frontend/proxy.ts to attach the same key backend/services/auth.py
      # checks - passed through explicitly (not via env_file) rather than
      # loading all of .env into this container, which has no other reason to
      # see AWS/LLM/DB credentials meant for the backend.
      - TERRAAGENT_API_KEY=${TERRAAGENT_API_KEY:-}
    networks:
      - terraagent-net
    depends_on:
      - terraagent-api

  # ============================================================================
  # 3. Redis Task Broker & Real-time SSE Pub/Sub
  # ============================================================================
  terraagent-redis:
    image: redis:7-alpine
    container_name: terraagent-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # No host port publish: Redis holds job state, logs, and the Celery broker
    # with no other access control - only reachable from other containers on
    # terraagent-net, never directly from outside the host.
    networks:
      - terraagent-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 4. Celery Async Worker (LangGraph Multi-Agent Execution)
  # ============================================================================
  terraagent-celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: terraagent-celery
    restart: unless-stopped
    command: celery -A services.celery_app worker --beat --loglevel=info
    volumes:
      - ../security:/app/security:ro
      - terraagent_output:/tmp/terraagent
      - terraform_plugin_cache:/home/agent/.terraform.d/plugin-cache
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@terraagent-redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@terraagent-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@terraagent-redis:6379/0
      - OLLAMA_HOST=http://terraagent-ollama:11434
      - DATABASE_URL=postgresql://terraagent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@terraagent-postgres:5432/terraagent
    networks:
      - terraagent-net
    depends_on:
      terraagent-redis:
        condition: service_started
      terraagent-ollama:
        condition: service_started
      terraagent-postgres:
        condition: service_healthy

  # ============================================================================
  # 3b. PostgreSQL (audit-trail DB) & pgAdmin (dev inspection, profile "dev")
  # ============================================================================
  terraagent-postgres:
    image: postgres:15
    container_name: terraagent-postgres
    restart: unless-stopped
    # No host port publish: only terraagent-api/terraagent-celery need to
    # reach this, over terraagent-net - never directly from outside the host.
    environment:
      - POSTGRES_USER=terraagent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=terraagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terraagent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraagent -d terraagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  terraagent-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: terraagent-pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@terraagent.example}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - terraagent-net
    depends_on:
      - terraagent-postgres

  # ============================================================================
  # 4b. Prometheus & Grafana (monitoring, profile "monitoring")
  # ============================================================================
  terraagent-prometheus:
    image: prom/prometheus:latest
    container_name: terraagent-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - terraagent-net
    depends_on:
      - terraagent-api

  terraagent-grafana:
    image: grafana/grafana:latest
    container_name: terraagent-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - terraagent-net
    depends_on:
      - terraagent-prometheus

  # ============================================================================
  # 5. Ollama Local LLM Server (Terraform Generation & Repair)
  # ============================================================================
  terraagent-ollama:
    image: ollama/ollama:latest
    container_name: terraagent-ollama
    restart: unless-stopped
    # No host port publish: Ollama has no built-in auth, and only
    # terraagent-api/terraagent-celery need to reach it (via OLLAMA_HOST's
    # internal hostname) - publishing it would be an open, unauthenticated
    # inference endpoint on the host.
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - terraagent-net

  # ============================================================================
  # 5b. LocalStack AWS Emulator (test profile only - integration tests)
  # ============================================================================
  terraagent-localstack:
    image: localstack/localstack:3.0
    container_name: terraagent-localstack
    restart: unless-stopped
    profiles: ["test"]
    ports:
      - "4566:4566"
    environment:
      # rds deliberately NOT listed here - verified live against this exact
      # image (localstack/localstack:3.0, "edition": "community" in its own
      # /_localstack/health response): RDS emulation is LocalStack Pro-only.
      # It didn't even appear in the health response's services dict (not
      # even as "disabled", unlike dynamodb/lambda/every other
      # community-known-but-unrequested service) - the community edition
      # doesn't recognize it as a service at all. Listing it here was dead
      # config that silently implied RDS scanning was covered by this
      # integration profile when it structurally never could be.
      - SERVICES=ec2,s3,iam,sts
      - DEBUG=0
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - terraagent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================================
  # 6. Nginx Ingress Reverse Proxy
  # ============================================================================
  terraagent-nginx:
    image: nginx:alpine
    container_name: terraagent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - terraagent-net
    depends_on:
      terraagent-frontend:
        condition: service_started
      # service_healthy, not just service_started: terraagent-api defines a
      # real healthcheck (/api/health) but nginx's old plain depends_on list
      # form only waits for the container to START, not for FastAPI's own
      # startup (DB init, Redis connect) to actually finish - a cold
      # `docker compose up` could have nginx proxying to a backend that
      # isn't listening yet, causing transient 502s.
      terraagent-api:
        condition: service_healthy

volumes:
  ollama_data:
  terraagent_output:
  terraform_plugin_cache:
  localstack_data:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
